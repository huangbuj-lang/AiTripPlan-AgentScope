<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帖子 · AI 旅行规划助手</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .pd-wrap { width: 100%; max-width: 1400px; margin: 30px auto; padding: 0 24px; }
  .pd-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,480px); gap:18px; align-items:start; }
  @media (max-width: 980px) { .pd-grid { grid-template-columns:1fr; } }
  .back-link { display:inline-block; margin-bottom:16px; color:#0984e3; font-size:14px; text-decoration:none; }
  .pd-card { background:#fff; border-radius:16px; padding:28px; box-shadow:0 6px 24px rgba(9,132,227,.08); margin-bottom:18px; }
  .pd-card h1 { margin:0 0 10px; font-size:22px; }
  .pd-meta { font-size:13px; color:#b2bec3; margin-bottom:16px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .pd-content { font-size:15px; line-height:1.8; color:#2d3436; }
  .pd-actions { display:flex; gap:12px; margin-top:18px; padding-top:16px; border-top:1px solid #eee; }
  /* 删帖键：标题右侧幽灵按钮，悬停变红 */
  .pd-del { flex-shrink:0; background:none; border:1px solid #dfe6e9; color:#b2bec3; border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; transition:.15s; font-family:inherit; }
  .pd-del:hover { color:#e17055; border-color:#e17055; background:#fdeee9; }
  .act-btn { padding:8px 16px; border-radius:8px; border:1px solid #dfe6e9; background:#fff; cursor:pointer; font-size:14px; color:#636e72; }
  .act-btn.active { background:#00b894; color:#fff; border-color:#00b894; }
  .trip-embed { background:#f8fbf9; border:1px solid #d4efe9; border-radius:12px; padding:16px; margin-top:16px; }
  .trip-embed h4 { margin:0 0 8px; color:#00a381; }
  .btn-primary { background:linear-gradient(135deg,#00b894,#00a381); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  .comments { background:#fff; border-radius:16px; padding:28px; box-shadow:0 6px 24px rgba(9,132,227,.08); }
  .comments h3 { margin-top:0; }
  .comment { padding:14px 0; border-bottom:1px solid #f0f0f0; }
  .comment .c-head { font-size:13px; color:#636e72; margin-bottom:4px; }
  .comment .c-head b { color:#2d3436; }
  .comment .c-body { font-size:14px; line-height:1.6; }
  .comment.reply { margin-left:32px; }
  .comment .c-reply { font-size:12px; color:#0984e3; cursor:pointer; margin-left:10px; }
  .comment-input { display:flex; gap:10px; margin-top:18px; }
  .comment-input input { flex:1; padding:11px 14px; border:1px solid #dfe6e9; border-radius:8px; font-size:14px; }
  .comment-input button { background:linear-gradient(135deg,#00b894,#00a381); color:#fff; border:none; border-radius:8px; padding:0 22px; cursor:pointer; }
  .comment.ai { background:#f4fbf9; border-radius:10px; padding:12px 14px; }
  .ai-badge { display:inline-block; background:#0984e3; color:#fff; font-size:11px; padding:1px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }
  .adopt-badge { display:inline-block; background:#00b894; color:#fff; font-size:11px; padding:1px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .adopt-btn { margin-left:8px; background:#fff; color:#00a381; border:1px solid #00b894; border-radius:6px; padding:2px 10px; font-size:12px; cursor:pointer; }
  .adopt-btn:hover { background:#00b894; color:#fff; }
</style>
<link rel="stylesheet" href="css/travel-theme.css?v=20260828a">
</head>
<body>
<div class="pd-wrap">
  <a class="back-link" href="forum.html"><i class="fa-solid fa-arrow-left"></i> 返回论坛</a>

  <div class="pd-grid">
    <div class="pd-card" id="postCard"><div class="empty">加载中...</div></div>

    <div class="comments">
      <h3><i class="fa-regular fa-comments"></i> 评论（<span id="commentCount">0</span>）</h3>
      <div id="commentList"></div>
      <div class="comment-input">
        <input id="commentInput" placeholder="写下你的评论..." onkeydown="if(event.key==='Enter') submitComment()">
        <button onclick="submitComment()">评论</button>
      </div>
    </div>
  </div>
</div>

<script src="js/purify.min.js"></script>
<script src="js/post.js"></script>
  <script src="js/genstatus.js"></script>
</body>
</html>
