<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · AI 旅行规划助手</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .profile-wrap { max-width: 820px; margin: 30px auto; padding: 0 16px; }
  .profile-card { background: #fff; border-radius: 16px; box-shadow: 0 6px 24px rgba(9,132,227,.08); overflow: hidden; }
  .profile-head { padding: 24px 28px; background: linear-gradient(135deg,#00b894,#00a381); color: #fff; display:flex; align-items:center; gap:16px; }
  .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; overflow:hidden; }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-head h2 { margin:0; font-size:20px; }
  .profile-head .sub { font-size:13px; opacity:.9; margin-top:4px; }
  .profile-tabs { display:flex; border-bottom:1px solid #eee; padding:0 12px; }
  .profile-tabs button { border:none; background:none; padding:14px 18px; font-size:14px; cursor:pointer; color:#636e72; border-bottom:3px solid transparent; }
  .profile-tabs button.active { color:#00b894; border-bottom-color:#00b894; font-weight:600; }
  .profile-body { padding: 24px 28px; min-height: 300px; }
  .form-row { margin-bottom: 16px; }
  .form-row label { display:block; font-size:13px; color:#636e72; margin-bottom:6px; }
  .form-row input, .form-row textarea { width:100%; padding:10px 12px; border:1px solid #dfe6e9; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; }
  .form-row input:focus, .form-row textarea:focus { border-color:#00b894; }
  .btn-primary { background: linear-gradient(135deg,#00b894,#00a381); color:#fff; border:none; border-radius:8px; padding:11px 22px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-danger { background:#e17055; color:#fff; border:none; border-radius:8px; padding:11px 22px; font-size:14px; cursor:pointer; }
  .btn-ghost { background:#f1f2f6; color:#636e72; border:none; border-radius:8px; padding:11px 22px; font-size:14px; cursor:pointer; }
  .form-msg { font-size:13px; margin-top:8px; }
  .form-msg.ok { color:#00b894; } .form-msg.err { color:#e17055; }
  .tag-group { display:flex; flex-wrap:wrap; gap:8px; }
  .tag { padding:6px 14px; border-radius:20px; background:#f1f2f6; cursor:pointer; font-size:13px; color:#636e72; border:1px solid transparent; }
  .tag.selected { background:#00b894; color:#fff; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
  .stat-card { background:#f8f9fa; border-radius:12px; padding:18px; text-align:center; }
  .stat-card .num { font-size:26px; font-weight:700; color:#00b894; }
  .stat-card .label { font-size:12px; color:#636e72; margin-top:6px; }
  .danger-zone { margin-top:28px; padding-top:20px; border-top:1px solid #eee; }
  .seg-btn { padding:8px 16px; border-radius:8px; border:1px solid #dfe6e9; background:#fff; cursor:pointer; font-size:13px; color:#636e72; margin-right:8px; }
  .seg-btn.active { background:#00b894; color:#fff; border-color:#00b894; }
  .back-link { display:inline-block; margin-bottom:16px; color:#0984e3; font-size:14px; text-decoration:none; }
</style>
<link rel="stylesheet" href="css/travel-theme.css?v=20260828a">
</head>
<body>
<div class="profile-wrap">
  <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> 返回首页</a>

  <div class="profile-card">
    <div class="profile-head">
      <div class="profile-avatar" id="avatarBox"><i class="fa-regular fa-circle-user"></i></div>
      <div>
        <h2 id="pUsername">加载中...</h2>
        <div class="sub" id="pMeta">—</div>
      </div>
    </div>

    <div class="profile-tabs">
      <button data-tab="info" class="active">资料</button>
      <button data-tab="prefs">旅行偏好</button>
      <button data-tab="stats">统计</button>
      <button data-tab="account">账号与安全</button>
    </div>

    <div class="profile-body">
      <!-- 资料 -->
      <div id="tab-info">
        <div class="form-row"><label>昵称</label><input id="nickname" placeholder="填写昵称"></div>
        <div class="form-row"><label>头像 URL</label><input id="avatarUrl" placeholder="https://... 图片链接"></div>
        <div class="form-row"><label>邮箱</label><input id="email" placeholder="you@example.com"></div>
        <div class="form-row"><label>个人简介</label><textarea id="bio" rows="3" placeholder="一句话介绍自己"></textarea></div>
        <button class="btn-primary" onclick="saveInfo(this)"><i class="fa-solid fa-floppy-disk"></i> 保存资料</button>
        <div class="form-msg" id="infoMsg"></div>
      </div>

      <!-- 偏好 -->
      <div id="tab-prefs" style="display:none">
        <div class="form-row">
          <label>旅行风格（可多选）</label>
          <div class="tag-group" id="styleTags"></div>
        </div>
        <div class="form-row">
          <label>预算档</label>
          <div>
            <button class="seg-btn" data-budget="1">经济</button>
            <button class="seg-btn" data-budget="2">舒适</button>
            <button class="seg-btn" data-budget="3">奢华</button>
          </div>
        </div>
        <div class="form-row">
          <label>节奏</label>
          <div>
            <button class="seg-btn" data-pace="1">紧凑</button>
            <button class="seg-btn" data-pace="2">适中</button>
            <button class="seg-btn" data-pace="3">松弛</button>
          </div>
        </div>
        <div class="form-row">
          <label>忌口 / 回避项（逗号分隔）</label>
          <input id="avoidList" placeholder="例如：海鲜, 辣, 爬山">
        </div>
        <div class="form-row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="useByDefault" checked> 默认应用偏好到每次生成
          </label>
        </div>
        <button class="btn-primary" onclick="savePrefs(this)"><i class="fa-solid fa-floppy-disk"></i> 保存偏好</button>
        <div class="form-msg" id="prefsMsg"></div>
      </div>

      <!-- 统计 -->
      <div id="tab-stats" style="display:none">
        <div class="stat-grid">
          <div class="stat-card"><div class="num" id="stTrips">—</div><div class="label">保存行程数</div></div>
          <div class="stat-card"><div class="num" id="stCities">—</div><div class="label">目的地城市数</div></div>
          <div class="stat-card"><div class="num" id="stDays">—</div><div class="label">累计天数</div></div>
        </div>
      </div>

      <!-- 账号与安全 -->
      <div id="tab-account" style="display:none">
        <h4 style="margin-top:0">修改密码</h4>
        <div class="form-row"><label>旧密码</label><input type="password" id="oldPwd"></div>
        <div class="form-row"><label>新密码（至少6位）</label><input type="password" id="newPwd"></div>
        <button class="btn-primary" onclick="changePwd(this)">修改密码</button>
        <div class="form-msg" id="pwdMsg"></div>

        <div class="danger-zone">
          <h4 style="color:#e17055">注销账号</h4>
          <p style="font-size:13px;color:#636e72">注销后账号将被停用，无法登录，行程数据保留。</p>
          <button class="btn-danger" onclick="deleteAccount()">注销账号</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/profile.js"></script>
  <script src="js/genstatus.js"></script>
</body>
</html>
