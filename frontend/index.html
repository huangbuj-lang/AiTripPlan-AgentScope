<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行规划助手</title>
<!-- Font Awesome 图标库（国内 CDN，避免国外源加载慢） -->
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- 样式分离：主样式 + 打印专用样式（print.css 只在打印时生效） -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<div class="container">

    <!-- 头部：渐变装饰 + 主标题 + 副标题 -->
    <div class="header">
        <div class="header-logo">
            <i class="fa-solid fa-earth-asia"></i>
        </div>
        <h1>AI 旅行规划助手</h1>
        <p>输入你的旅行需求，多 Agent 协作自动生成完整计划</p>
        <!-- 登录用户信息栏 -->
        <div class="user-bar">
            <span id="userName" class="user-chip"><i class="fa-regular fa-circle-user"></i> 未登录</span>
            <button class="mini-btn" id="myPlansBtn" onclick="showMyPlans()" style="display:none"><i class="fa-solid fa-folder-open"></i> 我的行程</button>
            <button class="mini-btn" id="logoutBtn" onclick="logout()" style="display:none"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
        </div>
    </div>

    <!-- 输入区：卡片式，聚焦发光 -->
    <div class="input-area">
        <i class="fa-solid fa-magnifying-glass input-icon"></i>
        <input id="prompt" type="text"
               placeholder="例如：帮我制定北京3日游计划 / 广州到珠海2日自驾游..."
               onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()"><i class="fa-solid fa-wand-magic-sparkles"></i> 生成计划</button>
        <button id="cancelBtn" onclick="cancelTask()" style="display:none;background:#e17055"><i class="fa-solid fa-stop"></i> 停止</button>
    </div>

    <!-- 状态条 -->
    <div id="status" class="status"><span class="status-dot"></span>⏳ 主管Agent正在规划中，请稍候（约1-3分钟）...</div>

    <!-- 思考过程区 -->
    <div class="panel panel-think">
        <div class="panel-title"><span class="dot"></span><i class="fa-solid fa-brain panel-title-icon"></i>思考过程（实时）</div>
        <div id="thinkBody" class="panel-body">
            <div class="empty">发送任务后，这里会实时显示主管Agent的每一步动作</div>
        </div>
    </div>

    <!-- 最终答案区 -->
    <div class="panel panel-result">
        <div class="panel-title">
            <span class="dot"></span><i class="fa-solid fa-clipboard-list panel-title-icon"></i>最终旅行计划
            <!-- ★ 打印 / 导出按钮（右上角，打印时隐藏） -->
            <span class="panel-actions no-print">
                <button type="button" class="btn-print" id="printBtn" onclick="toggleExportMenu(event)"><i class="fa-solid fa-print"></i> 打印 / 导出</button>
                <div class="export-menu" id="exportMenu" style="display:none">
                    <a href="javascript:void(0)" onclick="exportPDF(event)"><i class="fa-regular fa-file-pdf"></i> 导出 PDF（打印预览）</a>
                    <a href="javascript:void(0)" onclick="exportWord(event)"><i class="fa-regular fa-file-word"></i> 导出 Word 文档</a>
                </div>
            </span>
        </div>
        <div id="resultBody" class="panel-body result-body">
            <div class="empty">等待生成...</div>
        </div>
        <!-- 保存行程按钮（结果生成后显示） -->
        <div id="saveBar" class="save-bar" style="display:none">
            <button class="mini-btn save-btn" onclick="savePlan()"><i class="fa-solid fa-floppy-disk"></i> 保存到我的行程</button>
            <span id="saveMsg" class="save-msg"></span>
        </div>
    </div>

    <!-- 我的行程弹层 -->
    <div id="myPlansModal" class="my-plans-modal" style="display:none">
        <div class="modal-card">
            <div class="modal-head">
                <b><i class="fa-solid fa-folder-open"></i> 我的行程</b>
                <button class="mini-btn" onclick="closeMyPlans()"><i class="fa-solid fa-xmark"></i> 关闭</button>
            </div>
            <div id="myPlansList" class="modal-body"></div>
        </div>
    </div>

    <div class="footer">AiTripPlan-AgentScope · 多Agent协作系统 · 实时事件驱动</div>
</div>

<!-- DOMPurify：XSS 消毒库（本地化，查看历史行程时对旧 HTML 数据消毒） -->
<script src="js/purify.min.js"></script>
<!-- 逻辑分离：全部 JS 移到 js/app.js -->
<script src="js/app.js"></script>
</body>
</html>
