<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轨迹 · AI 旅行规划助手</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<!-- 背景：自转地球 + 地球村元素 -->
<div class="world-bg">
  <div class="earth">
    <svg viewBox="0 0 560 560">
      <g class="spin">
        <g fill="none" stroke="#9BC8BC" stroke-width="1.6" opacity=".8">
          <ellipse cx="280" cy="280" rx="250" ry="96"/>
          <ellipse cx="280" cy="280" rx="250" ry="178"/>
          <ellipse cx="280" cy="280" rx="96" ry="250"/>
          <ellipse cx="280" cy="280" rx="178" ry="250"/>
        </g>
        <g fill="rgba(31,174,143,.14)" stroke="rgba(31,174,143,.35)" stroke-width="1.4">
          <path d="M110 230 q55 -62 130 -56 t124 48 q34 76 -16 122 q-78 64 -144 22 q-80 -50 -94 -136 z"/>
          <path d="M330 360 q66 -26 78 -96 q18 -64 -28 -106 q-38 -34 -96 -14 q-68 20 -76 88 q-8 64 50 114 q26 22 72 14 z"/>
        </g>
        <circle cx="430" cy="180" r="12" fill="rgba(232,164,92,.8)"/>
        <circle cx="180" cy="400" r="9" fill="rgba(62,143,184,.75)"/>
        <circle cx="356" cy="452" r="7" fill="rgba(31,174,143,.7)"/>
      </g>
      <circle cx="280" cy="280" r="252" fill="none" stroke="#B9D8CE" stroke-width="2.4" opacity=".9"/>
    </svg>
  </div>
  <div class="cloud c1">
    <svg viewBox="0 0 320 100" fill="#FFFFFF">
      <g opacity=".9">
        <ellipse cx="90" cy="62" rx="58" ry="24"/><ellipse cx="150" cy="44" rx="46" ry="30"/>
        <ellipse cx="212" cy="62" rx="54" ry="22"/><rect x="36" y="62" width="230" height="24" rx="12"/>
      </g>
    </svg>
  </div>
  <div class="cloud c2">
    <svg viewBox="0 0 240 76" fill="#FFFFFF">
      <g opacity=".85">
        <ellipse cx="70" cy="46" rx="44" ry="18"/><ellipse cx="116" cy="32" rx="36" ry="23"/>
        <ellipse cx="162" cy="46" rx="42" ry="17"/><rect x="28" y="46" width="176" height="18" rx="9"/>
      </g>
    </svg>
  </div>
  <div class="balloon">
    <svg viewBox="0 0 150 210">
      <g>
        <ellipse cx="75" cy="72" rx="52" ry="60" fill="#E88A7D" opacity=".8"/>
        <path d="M23 72 q0 -66 52 -66 q52 0 52 66 z" fill="#F2B26B" opacity=".55"/>
        <path d="M23 72 q-16 34 0 48 q16 16 52 16 q36 0 52 -16 q16 -14 0 -48" fill="none" stroke="#C96F5E" stroke-width="2" opacity=".7"/>
        <path d="M40 120 l-12 24 M110 120 l12 24" stroke="#8A6B4F" stroke-width="2"/>
        <rect x="62" y="144" width="26" height="30" rx="7" fill="#8A6B4F" opacity=".85"/>
      </g>
    </svg>
  </div>
  <div class="village">
    <svg viewBox="0 0 420 130" preserveAspectRatio="none">
      <path d="M0 60 L60 20 L110 55 L170 30 L240 58 L300 24 L360 56 L420 34 L420 130 L0 130 Z" fill="#8FB8AC" opacity=".8"/>
      <g fill="#6FA28F" opacity=".8">
        <rect x="30" y="96" width="34" height="34"/><path d="M26 96 L47 76 L68 96 Z"/>
        <rect x="180" y="90" width="44" height="40"/><path d="M174 90 L202 66 L230 90 Z"/>
        <rect x="330" y="98" width="30" height="32"/><path d="M326 98 L345 82 L364 98 Z"/>
      </g>
    </svg>
  </div>
</div>

<div class="wrap">

  <!-- 打印视图(仅打印时显示:概览+详情) -->
  <div id="printView" class="print-view"></div>

  <!-- 导航 -->
  <nav>
    <div class="logo"><span class="pin"></span>轨迹 · TRACKS</div>
    <div class="nav-links">
      <span id="userName" class="chip"><i class="fa-regular fa-circle-user"></i> 未登录</span>
      <button id="adminBtn" class="chip" onclick="location.href='admin.html'" style="display:none"><i class="fa-solid fa-gauge"></i> 管理端</button>
      <button id="myPlansBtn" class="chip" onclick="showMyPlans()" style="display:none"><i class="fa-solid fa-folder-open"></i> 我的行程</button>
      <button id="forumBtn" class="chip" onclick="location.href='forum.html'" style="display:none"><i class="fa-solid fa-comments"></i> 论坛</button>
      <button id="chatBtn" class="chip" onclick="location.href='chat.html'"><i class="fa-solid fa-headset"></i> 客服</button>
      <button id="profileBtn" class="chip" onclick="location.href='profile.html'" style="display:none"><i class="fa-solid fa-user-gear"></i> 个人中心</button>
      <button id="logoutBtn" class="chip" onclick="logout()" style="display:none"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
    </div>
  </nav>

  <!-- 输入区 -->
  <div class="start">
    <div class="start-label">设定起点 · SET DEPARTURE</div>
    <div class="search">
      <input id="prompt" type="text" placeholder="想去哪儿？例如：北京 3 日美食之旅" onkeydown="if(event.key==='Enter') send()">
      <button id="sendBtn" class="btn-go" onclick="send()">开始旅程 →</button>
      <button id="cancelBtn" class="btn-cancel" onclick="cancelTask()" style="display:none"><i class="fa-solid fa-stop"></i> 停止</button>
    </div>

  </div>

  <!-- 状态条(轨迹副标题行) -->
  <div class="journey">
    <div class="journey-head">
      <h2 id="journeyTitle">旅行轨迹</h2>
      <span class="codes" id="journeyCodes">READY</span>
    </div>
    <div class="journey-sub" id="status"><span class="status-dot"></span>输入旅行需求，点击「开始旅程」</div>
  </div>

  <!-- 方案胶囊区(多方案时由 renderPlanSet 注入到 resultBody) -->

  <!-- 结果区：轨迹 + 天卡片 -->
  <div class="trip-view" id="resultBody">
    <div class="empty">等待生成...</div>
  </div>

  <!-- 保存条(对称操作条:打印/导出 + 保存) -->
  <div id="saveBar" class="save-bar" style="display:none">
    <button class="mini-btn" onclick="toggleExportMenu(event)"><i class="fa-solid fa-print"></i> 打印 / 导出</button>
    <div class="export-menu" id="exportMenu" style="display:none">
      <a href="javascript:void(0)" onclick="exportPDF(event)"><i class="fa-regular fa-file-pdf"></i> 导出 PDF</a>
      <a href="javascript:void(0)" onclick="exportWord(event)"><i class="fa-regular fa-file-word"></i> 导出 Word</a>
    </div>
    <span id="saveMsg" class="save-msg"></span>
    <button class="save-btn" onclick="savePlan()"><i class="fa-solid fa-floppy-disk"></i> 保存到我的行程</button>
  </div>

  <!-- 调度中心(思考过程) -->
  <div class="think">
    <div class="think-head">📡 调度中心<span class="live">LIVE</span></div>
    <div id="thinkBody" class="think-body">
      <div class="empty">发送任务后，这里会实时显示主管Agent的每一步动作</div>
    </div>
  </div>

  <footer>轨迹 TRACKS · 多 Agent 协作 · 实时事件驱动</footer>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <span class="em" id="modalEm">🏯</span>
      <div><h3 id="modalTitle">第 1 天</h3><div class="sub" id="modalSub">DAY ONE</div></div>
      <button class="x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 我的行程弹层 -->
<div id="myPlansModal" class="my-plans-modal" style="display:none">
  <div class="modal-card">
    <div class="modal-head">
      <b><i class="fa-solid fa-folder-open"></i> 我的行程</b>
      <button class="mini-btn" onclick="closeMyPlans()"><i class="fa-solid fa-xmark"></i> 关闭</button>
    </div>
    <div id="myPlansList" class="modal-body"></div>
  </div>
</div>

<script src="js/purify.min.js"></script>
<script src="js/app.js?v=20260827i"></script>
</body>
</html>
