<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发帖 · AI 旅行规划助手</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .np-wrap { width: 100%; max-width: 960px; margin: 30px auto; padding: 0 24px; }
  .np-card { background:#fff; border-radius:16px; padding:28px; box-shadow:0 6px 24px rgba(9,132,227,.08); }
  .np-card h2 { margin-top:0; }
  .form-row { margin-bottom:18px; }
  .form-row label { display:block; font-size:13px; color:#636e72; margin-bottom:6px; }
  .form-row input, .form-row textarea, .form-row select { width:100%; padding:11px 14px; border:1px solid #dfe6e9; border-radius:8px; font-size:14px; box-sizing:border-box; outline:none; }
  .form-row textarea { min-height:200px; font-family:inherit; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color:#00b894; }
  .form-row select { appearance:none; -webkit-appearance:none; color:#2d3436; background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2 4l4 4 4-4' fill='none' stroke='%2374857F' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 12px center/12px; cursor:pointer; transition:border-color .15s; }
  .form-row select:hover { border-color:#cfe0da; }
  .form-row select option { background:#fff; color:#2d3436; }
  .form-row select option:checked { background:#f2f7f5; color:#1a8a72; }
  .btn-primary { background:linear-gradient(135deg,#00b894,#00a381); color:#fff; border:none; border-radius:8px; padding:12px 26px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-ghost { background:#f1f2f6; color:#636e72; border:none; border-radius:8px; padding:12px 20px; font-size:14px; cursor:pointer; margin-left:10px; }
  .form-msg { font-size:13px; margin-top:10px; } .form-msg.ok { color:#00b894; } .form-msg.err { color:#e17055; }
  .hint { font-size:12px; color:#b2bec3; margin-top:4px; }
  .back-link { display:inline-block; margin-bottom:16px; color:#0984e3; font-size:14px; text-decoration:none; }
  /* ---- 下拉框美化（仅本页）：版块 / 关联行程 → 圆角自定义下拉（原生 <select> 只留取值，不改任何 JS 逻辑）---- */
  .np-dd { position: relative; }
  .np-dd select { position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
  .np-dd-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 14px; border:1px solid #dfe6e9; border-radius:12px; background:#fff; color:#2d3436;
    font-size:14px; cursor:pointer; text-align:left; transition:border-color .15s, box-shadow .15s; }
  .np-dd-btn:hover { border-color:#cfe0da; }
  .np-dd.open .np-dd-btn { border-color:#00b894; box-shadow:0 0 0 4px rgba(0,184,148,.10); }
  .np-dd-ar { color:#74857F; font-size:12px; transition:transform .16s; }
  .np-dd.open .np-dd-ar { transform:rotate(180deg); color:#00b894; }
  .np-dd-menu { display:none; position:absolute; z-index:30; left:0; right:0; top:calc(100% + 6px);
    max-height:280px; overflow:auto; background:#fff; border:1px solid #eef2f1; border-radius:12px;
    box-shadow:0 10px 28px rgba(9,132,227,.12); padding:6px; }
  .np-dd.open .np-dd-menu { display:block; }
  .np-dd-item { padding:9px 12px; border-radius:9px; font-size:14px; color:#2d3436; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-dd-item:hover { background:#f2f7f5; }
  .np-dd-item.on { background:#e9f7f2; color:#1a8a72; font-weight:600; }
</style>
<link rel="stylesheet" href="css/travel-theme.css?v=20260828a">
</head>
<body>
<div class="np-wrap">
  <a class="back-link" href="forum.html"><i class="fa-solid fa-arrow-left"></i> 返回论坛</a>
  <div class="np-card">
    <h2><i class="fa-solid fa-pen"></i> 发布帖子</h2>
    <div class="form-row">
      <label>版块</label>
      <select id="boardId"></select>
      <div class="hint" id="aiHint" style="display:none; color:#e08a00; margin-top:6px"><i class="fa-solid fa-robot"></i> 问答版帖子可以请求 AI 答主回答（发帖后在自己帖子页操作）</div>
    </div>
    <div class="form-row">
      <label>标题</label>
      <input id="title" placeholder="一句话说明主题">
    </div>
    <div class="form-row">
      <label>关联我的行程（可选，关联后自动展示行程卡片）</label>
      <select id="tripId"><option value="">不关联</option></select>
    </div>
    <div class="form-row" id="mateFields" style="display:none">
      <label>目的地</label><input id="destination" placeholder="如：成都">
      <label style="margin-top:10px">出行日期</label><input id="travelDate" type="date">
    </div>
    <div class="form-row">
      <label>内容（支持 Markdown）</label>
      <textarea id="content" placeholder="分享你的旅行见闻、攻略或问题..."></textarea>
      <div class="hint">支持 # 标题、**加粗**、- 列表、[链接](url) 等 Markdown 语法</div>
    </div>
    <button class="btn-primary" onclick="submit(this)"><i class="fa-solid fa-paper-plane"></i> 发布</button>
    <button class="btn-ghost" onclick="location.href='forum.html'">取消</button>
    <div class="form-msg" id="msg"></div>
  </div>
</div>
<script src="js/new-post.js"></script>
</body>
</html>
