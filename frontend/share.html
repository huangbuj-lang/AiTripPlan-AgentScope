<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享的旅行计划 · AI 旅行规划助手</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/print.css" media="print">
<style>
  .share-wrap { max-width: 900px; margin: 30px auto; padding: 0 16px; }
  .share-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .share-brand { color:#00b894; font-weight:700; font-size:16px; }
  .share-brand i { margin-right:6px; }
  .share-meta { font-size:13px; color:#636e72; }
  .share-empty { text-align:center; padding:60px 20px; color:#636e72; font-size:15px; }
  .password-box { max-width:360px; margin:60px auto; background:#fff; border-radius:14px; padding:28px; box-shadow:0 6px 24px rgba(9,132,227,.08); text-align:center; }
  .password-box input { width:100%; padding:10px 12px; border:1px solid #dfe6e9; border-radius:8px; font-size:14px; margin-bottom:12px; box-sizing:border-box; }
  .btn-primary { background:#00b894; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:14px; cursor:pointer; font-family:inherit; transition:opacity .15s; }
  .btn-primary:hover { opacity:.88; }
  .btn-primary:focus-visible { outline:1.5px solid #00b894; outline-offset:2px; }
  .password-box button { width:100%; }
  .share-place-link { color:#00b894; text-decoration:none; border-bottom:1px dashed #00b894; cursor:pointer; }
  .share-place-link:hover { color:#00856a; border-bottom-style:solid; }
</style>
<link rel="stylesheet" href="css/travel-theme.css?v=20260828a">
</head>
<body>
<div class="share-wrap">
  <div class="share-top">
    <div class="share-brand"><i class="fa-solid fa-earth-asia"></i> AI 旅行规划助手 · 行程分享</div>
    <div class="share-meta" id="shareMeta"></div>
  </div>

  <!-- 密码输入框（需要密码时显示） -->
  <div class="password-box" id="passwordBox" style="display:none">
    <h3 style="margin-top:0"><i class="fa-solid fa-lock"></i> 此分享需要密码</h3>
    <input type="password" id="sharePwd" placeholder="请输入分享密码" onkeydown="if(event.key==='Enter') submitPwd()">
    <button class="btn-primary" onclick="submitPwd()">查看行程</button>
    <div class="form-msg err" id="pwdErr" style="display:none"></div>
  </div>

  <!-- 内容区 -->
  <div id="shareBody"><div class="share-empty">加载中...</div></div>
</div>

<script src="js/share.js?v=20260907d"></script>
</body>
</html>
