<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 漫旅</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<!-- 左侧品牌视觉（大图+衬线标语），右侧登录卡 —— 漫旅双栏布局 -->
<div class="login-shell">
  <div class="login-visual">
    <div class="lv-brand"><span class="pin"></span>漫旅 · MANLÜ</div>
    <h1 class="lv-title">世界正在等待，<br><em>今天就开始规划。</em></h1>
    <p class="lv-sub">量身定制的行程，通往世界上最壮丽的自然奇观。</p>
  </div>

  <div class="login-side">
    <div class="login-card">
      <div class="logo">
        <div class="icon"><i class="fa-solid fa-compass"></i></div>
        <h1>登录漫旅</h1>
        <p>多 Agent 协作 · 登录后开启旅程</p>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
        <div class="tab" id="tabRegister" onclick="switchTab('register')">注册</div>
      </div>

      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码（至少6位）" autocomplete="current-password">
      </div>

      <button class="btn-login" id="btnSubmit" onclick="submit()">登 录</button>
      <div class="msg" id="msg"></div>
      <div class="footer">AiTripPlan-AgentScope · 多Agent协作系统</div>
    </div>
  </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
