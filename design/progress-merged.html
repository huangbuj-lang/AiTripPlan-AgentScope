<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>进度条 × 调度中心 · 合并方案预览</title>
<style>
/* ===== 配色直接取自项目 frontend/css/style.css 的 :root，不是另起一套 ===== */
:root {
  --sand-50:#FBF8F3; --sand-100:#F4EFE6; --sand-200:#EAE3D5;
  --forest-950:#0F1A14; --forest-900:#1D2D23; --forest-700:#2C4636;
  --green-600:#3A6149; --green-500:#47755A; --green-100:#E3EDE6;
  --gold:#C9A96A; --panel:#FFFFFF; --muted:#64736E; --line:#EAE3D5;
  --serif: "Songti SC", "SimSun", Georgia, serif;
  --mono: "SF Mono", Consolas, "Courier New", monospace;
}
* { box-sizing:border-box; }
body { margin:0; padding:34px 22px 60px; background:var(--sand-50); color:var(--forest-900);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:760px; margin:0 auto; }
h1 { font-family:var(--serif); font-size:22px; margin:0 0 6px; }
.sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
.tagline { font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--gold); margin-bottom:10px; }

/* ===== 对比条：现状两块 ===== */
.now { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:18px; }
.now .lbl { font-size:11px; font-family:var(--mono); letter-spacing:1.5px; color:var(--muted); margin-bottom:9px; }
.now .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.oldbar { flex:1; min-width:210px; height:10px; background:var(--green-100); border-radius:99px; overflow:hidden; }
.oldbar i { display:block; height:100%; width:44%; background:linear-gradient(90deg,var(--green-600),#7fd4c0); border-radius:99px; }
.oldthink { flex:1; min-width:210px; background:var(--forest-950); color:#C9CFC5; border-radius:10px; padding:7px 11px; font-size:12px; }
.oldthink b { color:#F5F1E8; font-family:var(--serif); font-size:12.5px; }

/* ===== 合并后的面板 ===== */
.panel { background:var(--forest-950); border-radius:22px; padding:24px 26px 20px; color:#E8E4DA;
         box-shadow:0 18px 50px rgba(15,26,20,.28); }
.head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.head .t { font-family:var(--serif); font-size:17px; font-weight:600; color:#F5F1E8; }
.live { background:rgba(201,169,106,.18); color:var(--gold); font-family:var(--mono); font-size:10.5px;
        letter-spacing:2px; padding:3px 12px; border-radius:9999px; border:1px solid rgba(201,169,106,.45); }
.live.done { background:rgba(127,212,192,.16); color:#7fd4c0; border-color:rgba(127,212,192,.45); }
.live.stop { background:rgba(214,146,106,.16); color:#E0A47E; border-color:rgba(224,164,126,.45); }
.head .clock { margin-left:auto; font-family:var(--mono); font-size:12.5px; color:#9FB0A6; }
.head .clock b { color:var(--gold); font-weight:700; }

/* 大数字 + 当前阶段 */
.bigrow { display:flex; align-items:baseline; gap:14px; margin:20px 0 12px; }
.pct { font-family:var(--mono); font-size:38px; font-weight:800; color:var(--gold); line-height:1; letter-spacing:-1px; }
.stage { font-family:var(--serif); font-size:15px; color:#F5F1E8; }
.stage small { display:block; font-family:-apple-system,"PingFang SC",sans-serif; font-size:12.5px; color:#9FB0A6; margin-top:4px; letter-spacing:.3px; }

/* 主进度条 */
.track { height:9px; background:rgba(255,255,255,.09); border-radius:99px; overflow:hidden; position:relative; }
.fill { height:100%; width:5%; background:linear-gradient(90deg,var(--green-500),#7fd4c0); border-radius:99px;
        transition:width .7s cubic-bezier(.4,0,.2,1); position:relative; }
.fill::after { content:''; position:absolute; inset:0;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent); animation:shim 1.6s infinite; }
@keyframes shim { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* 阶段刻度 */
.rail { display:flex; margin:14px 0 4px; }
.node { flex:1; text-align:center; position:relative; }
.node .dot { width:13px; height:13px; border-radius:50%; margin:0 auto 7px; background:rgba(255,255,255,.13);
             border:1px solid rgba(255,255,255,.18); position:relative; z-index:2; }
.node .nm { font-size:11.5px; color:#7C8B82; letter-spacing:.3px; }
.node::before { content:''; position:absolute; top:6px; left:-50%; width:100%; height:1px; background:rgba(255,255,255,.12); z-index:1; }
.node:first-child::before { display:none; }
.node.on .dot { background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,169,106,.18); }
.node.on .nm { color:#F5F1E8; font-weight:600; }
.node.now .dot { animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 4px rgba(201,169,106,.18)} 50%{box-shadow:0 0 0 9px rgba(201,169,106,.05)} }
.node.done .dot { background:var(--green-500); border-color:var(--green-500); }
.node.done .dot::after { content:'✓'; position:absolute; inset:0; font-size:9px; color:#0F1A14; line-height:11px; font-weight:700; }
.node.done .nm { color:#9FB0A6; }

/* 各环节状态 */
.agents { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 4px; }
.chip { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; color:#C9CFC5;
        background:rgba(255,255,255,.045); border-radius:9999px; padding:5px 12px; border:1px solid rgba(255,255,255,.07); }
.dotled { width:7px; height:7px; border-radius:50%; background:#5C6B62; }
.chip.run .dotled { background:var(--gold); animation:pulse2 1.3s infinite; }
.chip.ok .dotled { background:#7fd4c0; }
@keyframes pulse2 { 0%,100%{opacity:1} 50%{opacity:.25} }
.chip.run { border-color:rgba(201,169,106,.4); color:#F5F1E8; }

/* 步骤流 */
.steps { margin-top:14px; max-height:132px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:6px; }
.steps::-webkit-scrollbar { width:5px; } .steps::-webkit-scrollbar-thumb { background:rgba(201,169,106,.35); border-radius:3px; }
.item { display:flex; gap:10px; font-size:12.5px; padding:6px 11px; border-radius:12px;
        background:rgba(255,255,255,.045); border-left:2px solid rgba(201,169,106,.5); animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0; transform:translateY(4px)} to{opacity:1} }
.item .ts { font-family:var(--mono); font-size:11px; color:var(--gold); flex-shrink:0; padding-top:1px; }
.item .msg { color:#C9CFC5; }
.item.hl { background:rgba(201,169,106,.10); border-left-color:var(--gold); }
.item.hl .msg { color:#F5F1E8; }

.foot { margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.08);
        font-size:12px; color:#8A9A90; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.foot .k { color:var(--gold); font-family:var(--mono); }

.tools { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
button { font:inherit; font-size:13px; padding:9px 16px; border-radius:999px; cursor:pointer;
         border:1px solid var(--line); background:#fff; color:var(--forest-900); }
button.primary { background:var(--green-600); color:#fff; border-color:var(--green-600); }
button:hover { border-color:var(--green-500); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tagline">DESIGN PREVIEW</div>
  <h1>进度条 × 调度中心 · 合并方案</h1>
  <p class="sub">配色/字体/圆角全部沿用项目现有变量，不是另起一套。点下面的按钮看三种状态。</p>

  <div class="now">
    <div class="lbl">现状 · 两块分开</div>
    <div class="row">
      <div class="oldbar"><i></i></div>
      <div class="oldthink"><b>调度中心</b> LIVE　<span style="opacity:.7">正在安排每天的行程…</span></div>
    </div>
    <div class="row" style="margin-top:10px;font-size:12px;color:var(--muted)">
      <span>↑ 进度条在浅色区、调度中心在深绿区：风格割裂，考生看的是两块 ✗</span>
    </div>
  </div>

  <div class="tagline">AFTER · 合并成一个面板</div>
  <div class="panel">
    <div class="head">
      <span class="t">调度中心</span>
      <span class="live" id="liveTag">LIVE</span>
      <span class="clock">已用 <b id="used">00:00</b> · <span id="eta">预计还需 —</span></span>
    </div>

    <div class="bigrow">
      <div class="pct" id="pct">5%</div>
      <div class="stage"><span id="stageName">正在提交任务…</span><small id="stageDesc">正在接收你的需求</small></div>
    </div>

    <div class="track"><div class="fill" id="fill"></div></div>

    <div class="rail" id="rail"></div>

    <div class="agents" id="agents"></div>

    <div class="steps" id="steps">
      <div class="item"><span class="ts">00:00</span><span class="msg">发送任务后，这里会实时显示每一步进展</span></div>
    </div>

    <div class="foot">
      <span class="k">▸</span><span>任务在后台继续跑，可以关掉这个页面；回来点「我的行程」就能看到结果。</span>
    </div>
  </div>

  <div class="tools">
    <button class="primary" onclick="play()">▶ 重播一次</button>
    <button onclick="jump('done')">看完成态</button>
    <button onclick="jump('stop')">看中断态</button>
  </div>
</div>

<script>
const STAGES = [
  { key:'parse',  name:'需求规划完成', pct:8,  desc:'正在看清你要去哪里、去几天' },
  { key:'route',  name:'路线规划完成', pct:20, desc:'正在安排先去哪、后去哪' },
  { key:'plan',   name:'行程规划完成', pct:35, desc:'正在安排每天玩什么、吃什么、住哪儿' },
  { key:'merge',  name:'整合校验完成', pct:85, desc:'正在检查每天的节奏合不合理' },
  { key:'done',   name:'全部完成',     pct:100,desc:'行程已生成，正在准备展示' }
];
const AGENTS = [
  { id:'mgr',   nm:'需求理解', runAt:['parse'] },
  { id:'route', nm:'路线规划', runAt:['route'] },
  { id:'trip',  nm:'行程安排', runAt:['plan'] },
  { id:'check', nm:'整体检查', runAt:['merge'] }
];
// 脚本化时间线（前 30 秒密、后面稀，贴合真实：行程/整合各要 1-2 分钟）
const SCRIPT = [
  { t:1,  s:0, txt:'已收到你的需求：川西 7 天自驾', hl:1 },
  { t:3,  s:0, txt:'需求规划完成：7 天 · 川西环线 · 自驾' },
  { t:5,  s:1, txt:'开始规划路线' },
  { t:14, s:1, txt:'路线规划完成：成都 → 新都桥 → 稻城 → 丹巴 → 成都' },
  { t:18, s:2, txt:'开始安排每天的行程' },
  { t:34, s:2, txt:'第 1 天已排好（成都—康定—新都桥）' },
  { t:58, s:2, txt:'第 2-3 天已排好（稻城亚丁），含每天车程' },
  { t:86, s:2, txt:'行程规划完成：7 天全部排好' },
  { t:92, s:3, txt:'开始检查每天的节奏' },
  { t:118,s:3, txt:'检查通过：每天游玩时长在 4-8 小时内' },
  { t:132,s:4, txt:'行程已生成，正在准备展示' }
];
let timer=null, el=0;

let lastSi = -1, lastChips = -1, shownN = 0;
function render(pct, si, stepsDone){
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '%';
  const st = STAGES[si];
  document.getElementById('stageName').textContent = st.name;
  document.getElementById('stageDesc').textContent = st.desc;
  // 刻度：只在阶段变化时重建（每帧重建 = 闪动）
  if (si !== lastSi) { lastSi = si;
  document.getElementById('rail').innerHTML = STAGES.map((s,i) => {
    const cls = i < si ? 'done' : (i === si ? 'on now' : '');
    return `<div class="node ${cls}"><div class="dot"></div><div class="nm">${s.name}</div></div>`;
  }).join('');
  // 状态灯
  document.getElementById('agents').innerHTML = AGENTS.map(a => {
    const started = STAGES.findIndex(s => s.key === a.runAt[0]) <= si;
    const finished = STAGES.findIndex(s => s.key === a.runAt[0]) < si;
    const cls = !started ? '' : (finished ? 'ok' : 'run');
    const st2 = !started ? '待命' : (finished ? '已完成' : '进行中');
    return `<span class="chip ${cls}"><i class="dotled"></i>${a.nm} · ${st2}</span>`;
  }).join(''); }
  // 步骤：只追加新出现的条目，已渲染的不动（不动就不会闪）
  const box = document.getElementById('steps');
  if (stepsDone.length < shownN) { box.innerHTML = ''; shownN = 0; }
  for (let i = shownN; i < stepsDone.length; i++) {
    const x = stepsDone[i], d = document.createElement('div');
    d.className = 'item' + (x.hl ? ' hl' : '');
    d.innerHTML = `<span class="ts">${fmt(x.t)}</span><span class="msg">${x.txt}</span>`;
    box.appendChild(d);
  }
  shownN = stepsDone.length;
  box.scrollTop = box.scrollHeight;
  // 时间
  document.getElementById('used').textContent = fmt(el);
  const remain = Math.max(0, 165 - el);
  document.getElementById('eta').textContent = remain > 0 ? ('预计还需 ' + fmt(remain)) : '即将完成';
}
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');

function play(){
  if (timer) clearInterval(timer);
  el = 0; let shown = [];
  lastSi = -1; lastChips = -1; shownN = 0;
  document.getElementById('steps').innerHTML = '';
  document.getElementById('liveTag').className = 'live';
  document.getElementById('liveTag').textContent = 'LIVE';
  render(5, 0, [{t:0, txt:'正在接收你的需求'}]);
  timer = setInterval(() => {
    el++;
    // 阶段推进
    let si = 0; for (let i=SCRIPT.length-1;i>=0;i--){ if (el >= SCRIPT[i].t){ si = SCRIPT[i].s; break; } }
    // 进度：*真实阶段下限* + 阶段内缓推，不出现"半分钟到 72%"的假进度
    const base = STAGES[si].pct, next = STAGES[Math.min(si+1,4)].pct;
    const seg = (next - base) * Math.min(1, (el % 40) / 40);
    const pct = Math.min(99, Math.round(base + seg));
    shown = SCRIPT.filter(x => x.t <= el);
    render(pct, si, shown);
    if (el >= 165) { clearInterval(timer); timer=null; jump('done'); }
  }, 90);   // 预览用 90ms/秒，真实是 1 秒
}
function jump(kind){
  if (timer) { clearInterval(timer); timer = null; }
  if (kind === 'done'){
    document.getElementById('liveTag').className = 'live done';
    document.getElementById('liveTag').textContent = 'DONE';
    document.getElementById('eta').textContent = '用时 02:45';
    el = 165; render(100, 4, SCRIPT);
  } else {
    document.getElementById('liveTag').className = 'live stop';
    document.getElementById('liveTag').textContent = '已中断';
    document.getElementById('eta').textContent = '任务已停止';
    const done = SCRIPT.filter(x => x.t <= 58);
    render(52, 2, done.concat([{t:61, txt:'⚠ 任务被中断，可点「重新生成」再试一次', hl:1}]));
  }
}
play();
</script>
</body>
</html>
