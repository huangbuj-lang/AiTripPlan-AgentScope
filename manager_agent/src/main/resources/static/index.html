<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行规划助手</title>
<style>
    /* ===== 全局样式（简洁风格） ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #f5f6fa;
        color: #333;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 30px 16px;
    }
    .container { width: 100%; max-width: 860px; }

    /* ===== 头部 ===== */
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 {
        font-size: 28px;
        color: #2d3436;
        margin-bottom: 6px;
        letter-spacing: 2px;
    }
    .header p { color: #95a5a6; font-size: 14px; }

    /* ===== 输入区 ===== */
    .input-area {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    .input-area input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #dfe6e9;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border 0.2s;
    }
    .input-area input:focus { border-color: #0984e3; }
    .input-area button {
        padding: 12px 28px;
        background: #0984e3;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
    }
    .input-area button:hover { background: #0873c4; }
    .input-area button:disabled { background: #b2bec3; cursor: not-allowed; }

    /* ===== ★新功能：用户信息栏和小按钮 ===== */
    .user-bar {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .user-bar span { color: #0984e3; font-size: 14px; }
    .mini-btn {
        background: #fff;
        border: 1px solid #0984e3;
        color: #0984e3;
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .mini-btn:hover { background: #0984e3; color: #fff; }

    /* ===== 状态条 ===== */
    .status {
        text-align: center;
        color: #0984e3;
        font-size: 14px;
        margin-bottom: 16px;
        min-height: 20px;
        display: none;
    }
    .status.show { display: block; }

    /* ===== 两个输出区（思考过程 / 最终答案 分开） ===== */
    .panel {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        margin-bottom: 20px;
        overflow: hidden;
    }
    .panel-title {
        padding: 12px 20px;
        font-size: 15px;
        font-weight: bold;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    /* 思考过程：蓝色标识 */
    .panel-think .panel-title { color: #0984e3; background: #f0f8ff; }
    /* 最终答案：绿色标识 */
    .panel-result .panel-title { color: #00b894; background: #f0fff8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .panel-think .dot { background: #0984e3; }
    .panel-result .dot { background: #00b894; }

    .panel-body { padding: 16px 20px; max-height: 300px; overflow-y: auto; }

    /* 思考过程：灰色小字，逐条时间线 */
    .think-item {
        padding: 6px 0;
        border-bottom: 1px dashed #f0f0f0;
        font-size: 13px;
        color: #636e72;
        line-height: 1.6;
    }
    .think-item:last-child { border-bottom: none; }
    .think-time { color: #b2bec3; font-size: 12px; margin-right: 8px; font-family: Consolas, monospace; }
    .think-type { font-weight: bold; margin-right: 8px; }
    .think-type.t-user { color: #0984e3; }
    .think-type.t-tool { color: #e17055; }
    .think-type.t-think { color: #6c5ce7; }
    .think-type.t-done { color: #00b894; }
    .think-type.t-other { color: #95a5a6; }

    /* 最终答案：markdown 渲染 */
    .result-body { max-height: none; font-size: 15px; line-height: 1.8; }
    .result-body h1, .result-body h2, .result-body h3 { margin: 16px 0 8px; color: #2d3436; }
    .result-body h1 { font-size: 20px; border-bottom: 2px solid #00b894; padding-bottom: 6px; }
    .result-body h2 { font-size: 17px; }
    .result-body h3 { font-size: 15px; }
    .result-body p { margin: 8px 0; }
    .result-body ul, .result-body ol { margin: 8px 0 8px 24px; }
    .result-body li { margin: 4px 0; }
    .result-body strong { color: #2d3436; }
    .result-body hr { border: none; border-top: 1px solid #eee; margin: 16px 0; }
    .result-body blockquote { border-left: 3px solid #00b894; padding-left: 12px; color: #636e72; margin: 8px 0; }

    /* 空状态提示 */
    .empty { color: #b2bec3; font-size: 14px; text-align: center; padding: 30px 0; }

    /* ===== 页脚 ===== */
    .footer { text-align: center; color: #b2bec3; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <div class="header">
        <h1>🌏 AI 旅行规划助手</h1>
        <p>输入你的旅行需求，多 Agent 协作自动生成完整计划</p>
        <!-- ★新功能：登录用户信息栏 -->
        <div class="user-bar">
            <span id="userName">👤 未登录</span>
            <button class="mini-btn" id="myPlansBtn" onclick="showMyPlans()" style="display:none">📂 我的行程</button>
            <button class="mini-btn" id="logoutBtn" onclick="logout()" style="display:none">退出</button>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <input id="prompt" type="text"
               placeholder="例如：帮我制定北京3日游计划 / 广州到珠海2日自驾游..."
               onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()">生成计划</button>
    </div>

    <!-- 状态条 -->
    <div id="status" class="status">⏳ 主管Agent正在规划中，请稍候（约1-3分钟）...</div>

    <!-- 思考过程区 -->
    <div class="panel panel-think">
        <div class="panel-title"><span class="dot"></span>🧠 思考过程（实时）</div>
        <div id="thinkBody" class="panel-body">
            <div class="empty">发送任务后，这里会实时显示主管Agent的每一步动作</div>
        </div>
    </div>

    <!-- 最终答案区 -->
    <div class="panel panel-result">
        <div class="panel-title"><span class="dot"></span>📋 最终旅行计划</div>
        <div id="resultBody" class="panel-body result-body">
            <div class="empty">等待生成...</div>
        </div>
        <!-- ★新功能：保存行程按钮（结果生成后显示） -->
        <div id="saveBar" style="display:none; padding:12px 16px; border-top:1px solid #334155;">
            <button class="mini-btn" onclick="savePlan()">💾 保存到我的行程</button>
            <span id="saveMsg" style="color:#34d399; font-size:13px; margin-left:10px;"></span>
        </div>
    </div>

    <!-- ★新功能：我的行程弹层 -->
    <div id="myPlansModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:99; align-items:center; justify-content:center;">
        <div style="background:#1e293b; border:1px solid #334155; border-radius:16px; width:90%; max-width:720px; max-height:80vh; display:flex; flex-direction:column;">
            <div style="padding:16px 20px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
                <b style="color:#fff;">📂 我的行程</b>
                <button class="mini-btn" onclick="closeMyPlans()">关闭</button>
            </div>
            <div id="myPlansList" style="overflow-y:auto; padding:16px 20px; color:#cbd5e1;"></div>
        </div>
    </div>

    <div class="footer">AiTripPlan-AgentScope · 多Agent协作系统 · 实时事件驱动</div>
</div>

<script>
    // ===== 状态变量 =====
    let polling = null;        // 轮询定时器（/events）
    let resultTimer = null;    // 结果轮询定时器（/result）
    let knownCount = 0;        // 已显示的事件数
    let lastEventCount = 0;    // 发送前的事件总数（用于增量显示）

    // ===== ★新功能：登录状态检查（页面加载时执行） =====
    function checkLogin() {
        fetch('/api/check-login')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('userName').textContent = '👤 ' + data.username;
                    document.getElementById('myPlansBtn').style.display = 'inline-block';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                } else {
                    // 未登录：跳转登录页
                    location.href = '/login.html';
                }
            })
            .catch(() => { location.href = '/login.html'; });
    }

    // 退出登录
    function logout() {
        fetch('/api/logout', { method: 'POST' })
            .then(r => r.json())
            .then(() => { location.href = '/login.html'; })
            .catch(() => { location.href = '/login.html'; });
    }

    // 保存当前结果到数据库
    function savePlan() {
        const text = document.getElementById('resultBody').textContent.trim();
        if (!text || text.includes('正在生成') || text.includes('等待生成')) {
            document.getElementById('saveMsg').textContent = '暂无结果可保存';
            return;
        }
        // 从结果里提取城市和天数（简单取第一个关键词前的文本，容错处理）
        const prompt = document.getElementById('prompt').value.trim();
        const city = prompt.replace(/帮我制定|制定|计划|规划|3日游|2日游|1日游|自驾游|游/g, '').trim() || '未知城市';
        const daysMatch = prompt.match(/(\d+)日/);
        const days = daysMatch ? parseInt(daysMatch[1]) : 3;
        // 保存的是完整的markdown原文（不是textContent，保留格式）
        const html = document.getElementById('resultBody').innerHTML;

        // ★修复：用POST body传内容（原URL方式：行程全文塞进URL会超Tomcat 8KB限制→400保存失败）
        fetch('/api/save-plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ city: city, days: days, planContent: html })
        })
            .then(r => r.json())
            .then(data => {
                document.getElementById('saveMsg').textContent =
                    data.success ? '✅ ' + data.message : '❌ ' + data.message;
                if (!data.success && data.message.includes('登录')) location.href = '/login.html';
            })
            .catch(() => { document.getElementById('saveMsg').textContent = '❌ 保存失败，请重试'; });
    }

    // 打开"我的行程"弹层
    function showMyPlans() {
        fetch('/api/my-plans')
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('myPlansList');
                if (!data.success) { list.innerHTML = '<div style="color:#f87171">' + data.message + '</div>'; return; }
                const plans = data.plans || [];
                if (plans.length === 0) {
                    list.innerHTML = '<div class="empty">还没有保存的行程，先去规划一个吧！</div>';
                } else {
                    list.innerHTML = plans.map(p =>
                        '<div style="border:1px solid #334155; border-radius:10px; padding:12px 14px; margin-bottom:10px;">' +
                        '<div style="display:flex; justify-content:space-between; align-items:center;">' +
                        '<b style="color:#fff;">🏙️ ' + (p.city || '未知城市') + ' · ' + (p.days || 3) + '日游</b>' +
                        '<span style="color:#64748b; font-size:12px;">' + (p.created_at || '') + '</span>' +
                        '</div>' +
                        '<div style="margin-top:8px; max-height:120px; overflow-y:auto; font-size:13px; color:#94a3b8;">' +
                        (p.plan_content || '').replace(/<[^>]+>/g, ' ').slice(0, 200) + '...' +
                        '</div>' +
                        '<div style="margin-top:8px; text-align:right;">' +
                        '<button class="mini-btn" onclick="viewPlan(' + p.id + ')">查看</button> ' +
                        '<button class="mini-btn" onclick="deletePlan(' + p.id + ')">删除</button>' +
                        '</div></div>'
                    ).join('');
                }
                document.getElementById('myPlansModal').style.display = 'flex';
            })
            .catch(() => { });
    }

    // 查看某条行程（把内容渲染到主页结果区）
    function viewPlan(id) {
        fetch('/api/my-plans')
            .then(r => r.json())
            .then(data => {
                const p = (data.plans || []).find(x => x.id === id);
                if (p) {
                    document.getElementById('resultBody').innerHTML = p.plan_content;
                    document.getElementById('saveBar').style.display = 'none';
                    closeMyPlans();
                    document.getElementById('resultBody').scrollIntoView({ behavior: 'smooth' });
                }
            })
            .catch(() => { });
    }

    // 删除某条行程
    function deletePlan(id) {
        if (!confirm('确定删除这条行程吗？')) return;
        fetch('/api/delete-plan?id=' + id, { method: 'POST' })
            .then(r => r.json())
            .then(data => { showMyPlans(); })
            .catch(() => { });
    }

    // 关闭弹层
    function closeMyPlans() { document.getElementById('myPlansModal').style.display = 'none'; }

    // 页面加载时检查登录
    checkLogin();

    /**
     * 发送任务
     * ★部署修复：/app 立即返回（不占长连接）→ 只轮询 /events 看进度 → 完成后拉 /result
     * 修复手机端浏览器连接数限制导致思考过程不显示的问题
     */
    function send() {
        const prompt = document.getElementById('prompt').value.trim();
        if (!prompt) { alert('请输入旅行需求！'); return; }
        if (polling) { clearInterval(polling); polling = null; }
        if (resultTimer) { clearInterval(resultTimer); resultTimer = null; }

        // 重置界面
        document.getElementById('thinkBody').innerHTML = '';
        document.getElementById('resultBody').innerHTML = '<div class="empty">正在生成...</div>';
        document.getElementById('status').textContent = '⏳ 任务提交中...';
        document.getElementById('status').classList.add('show');
        document.getElementById('sendBtn').disabled = true;

        // ① 提交任务（后端立即返回，不占连接）
        fetch('/app?prompt=' + encodeURIComponent(prompt), { method: 'POST' })
            .then(r => r.text())
            .then(msg => {
                // 并发防护提示
                if (msg.includes('有任务正在执行')) {
                    document.getElementById('resultBody').innerHTML =
                        '<div style="color:#e17055">⚠️ ' + msg + '</div>';
                    document.getElementById('status').textContent = '⚠️ 任务未提交';
                    document.getElementById('sendBtn').disabled = false;
                    if (polling) { clearInterval(polling); polling = null; }
                    if (resultTimer) { clearInterval(resultTimer); resultTimer = null; }
                    return;
                }
                document.getElementById('status').textContent = '🧠 主管Agent正在规划中，请稍候...';
                // 服务端已清空事件，从0开始增量显示
                lastEventCount = 0;
                // ② 轮询 /events（唯一连接，实时思考过程）
                if (polling) clearInterval(polling);
                polling = setInterval(pollEvents, 1500);
                // ③ 轮询 /result（拿最终结果）
                if (resultTimer) clearInterval(resultTimer);
                resultTimer = setInterval(fetchResult, 2000);
            })
            .catch(err => {
                document.getElementById('resultBody').innerHTML =
                    '<div style="color:#d63031">❌ 请求失败：' + err + '</div>';
                document.getElementById('status').textContent = '❌ 出错了，请重试';
                document.getElementById('sendBtn').disabled = false;
            });
    }

    /**
     * 拉取最终结果（/result 返回非"执行中" = 完成）
     */
    function fetchResult() {
        fetch('/result')
            .then(r => r.text())
            .then(text => {
                if (text.includes('还在执行中')) return;  // 没完成，继续等

                // 完成！渲染最终结果
                clearInterval(resultTimer); resultTimer = null;
                if (polling) { clearInterval(polling); polling = null; }
                document.getElementById('resultBody').innerHTML = renderMarkdown(text);
                document.getElementById('status').textContent = '✅ 计划生成完成！';
                document.getElementById('sendBtn').disabled = false;
                // ★新功能：结果出来了，显示"保存到我的行程"按钮
                document.getElementById('saveBar').style.display = 'block';
                document.getElementById('saveMsg').textContent = '';
            })
            .catch(() => { /* 网络抖动，下轮重试 */ });
    }

    /**
     * 轮询事件接口，增量显示思考过程
     */
    function pollEvents() {
        fetch('/events')
            .then(r => r.json())
            .then(evts => {
                // 只取本次运行的新事件
                const fresh = evts.slice(lastEventCount);
                if (fresh.length === 0) return;

                const body = document.getElementById('thinkBody');
                // 移除空状态提示
                const empty = body.querySelector('.empty');
                if (empty) empty.remove();

                fresh.forEach(ev => {
                    const div = document.createElement('div');
                    div.className = 'think-item';

                    const time = document.createElement('span');
                    time.className = 'think-time';
                    time.textContent = ev.time || '';

                    const type = document.createElement('span');
                    type.className = 'think-type ' + typeClass(ev.type);
                    type.textContent = ev.type || '';

                    const content = document.createElement('span');
                    content.textContent = (ev.content || '').slice(0, 120) +
                        ((ev.content || '').length > 120 ? '...' : '');

                    div.appendChild(time);
                    div.appendChild(type);
                    div.appendChild(content);
                    body.appendChild(div);
                });

                // 自动滚动到底部
                body.scrollTop = body.scrollHeight;
                lastEventCount = evts.length;
            })
            .catch(() => { /* 接口暂不可达，忽略 */ });
    }

    /**
     * 事件类型 → 样式类
     */
    function typeClass(type) {
        if (type === '用户输入') return 't-user';
        if (type === '调用工具') return 't-tool';
        if (type === '思考') return 't-think';
        if (type === '完成') return 't-done';
        return 't-other';
    }

    /**
     * 简易 Markdown 渲染（标题/加粗/列表/引用/换行）
     */
    function renderMarkdown(text) {
        if (!text) return '<div class="empty">（空响应）</div>';
        // HTML转义，防止注入
        let html = text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        const lines = html.split('\n');
        let out = '';
        let inList = false;
        let inCode = false;

        lines.forEach(line => {
            const t = line.trim();
            // 代码块围栏（``` 开头/结束）
            if (/^```/.test(t)) {
                if (inList) { out += '</ul>'; inList = false; }
                if (inCode) { out += '</pre>'; inCode = false; }
                else { out += '<pre style="background:#f6f8fa;padding:12px;border-radius:8px;overflow-x:auto;">'; inCode = true; }
            }
            // 代码块内：原样输出
            else if (inCode) {
                out += t + '\n';
            }
            // 标题（支持 ### 后有无空格）
            else if (/^#{1,3}\s*\S/.test(t)) {
                if (inList) { out += '</ul>'; inList = false; }
                const level = t.match(/^#+/)[0].length;
                const title = t.replace(/^#+\s*/, '');
                out += '<h' + level + '>' + title + '</h' + level + '>';
            }
            // 列表项（- * 1. 1、• 等）
            else if (/^[-*•]\s/.test(t) || /^\d+[.、]\s/.test(t)) {
                if (!inList) { out += '<ul>'; inList = true; }
                out += '<li>' + t.replace(/^[-*•]\s/, '').replace(/^\d+[.、]\s/, '') + '</li>';
            }
            // 引用
            else if (/^>\s?/.test(t)) {
                if (inList) { out += '</ul>'; inList = false; }
                out += '<blockquote>' + t.replace(/^>\s?/, '') + '</blockquote>';
            }
            // 分隔线
            else if (/^---+$/.test(t) || /^\*\*\*+$/.test(t) || /^___+$/.test(t)) {
                if (inList) { out += '</ul>'; inList = false; }
                out += '<hr>';
            }
            // 空行
            else if (t === '') {
                if (inList) { out += '</ul>'; inList = false; }
            }
            // 普通段落
            else {
                if (inList) { out += '</ul>'; inList = false; }
                out += '<p>' + t + '</p>';
            }
        });
        if (inList) out += '</ul>';
        if (inCode) out += '</pre>';

        // 加粗 **xxx** → <strong>xxx</strong>
        out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // 行内代码 `xxx` → <code>
        out = out.replace(/`([^`]+)`/g, '<code style="background:#f6f8fa;padding:2px 6px;border-radius:4px;">$1</code>');
        return out;
    }
</script>
</body>
</html>
