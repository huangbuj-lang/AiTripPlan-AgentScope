<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI旅行规划助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo .icon { font-size: 44px; }
        .logo h1 { color: #fff; font-size: 22px; margin-top: 10px; }
        .logo p { color: #94a3b8; font-size: 13px; margin-top: 6px; }
        .tabs { display: flex; background: #0f172a; border-radius: 10px; padding: 4px; margin-bottom: 24px; }
        .tab {
            flex: 1; text-align: center; padding: 10px 0; cursor: pointer;
            border-radius: 8px; color: #94a3b8; font-size: 15px; transition: all .2s;
        }
        .tab.active { background: #3b82f6; color: #fff; }
        .form-group { margin-bottom: 18px; }
        .form-group label { color: #cbd5e1; font-size: 13px; display: block; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 14px;
            background: #0f172a; border: 1px solid #334155; border-radius: 10px;
            color: #fff; font-size: 15px; outline: none; transition: border .2s;
        }
        .form-group input:focus { border-color: #3b82f6; }
        .btn-login {
            width: 100%; padding: 13px; margin-top: 6px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; border-radius: 10px; color: #fff; font-size: 16px;
            cursor: pointer; transition: opacity .2s;
        }
        .btn-login:hover { opacity: .9; }
        .btn-login:disabled { opacity: .5; cursor: not-allowed; }
        .msg { margin-top: 14px; text-align: center; font-size: 13px; min-height: 20px; }
        .msg.ok { color: #34d399; }
        .msg.err { color: #f87171; }
        .footer { text-align: center; margin-top: 20px; color: #475569; font-size: 12px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <div class="icon">🌏</div>
        <h1>AI 旅行规划助手</h1>
        <p>多 Agent 协作 · 登录后使用</p>
    </div>

    <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
        <div class="tab" id="tabRegister" onclick="switchTab('register')">注册</div>
    </div>

    <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码（至少6位）" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btnSubmit" onclick="submit()">登 录</button>
    <div class="msg" id="msg"></div>
    <div class="footer">AiTripPlan-AgentScope · 多Agent协作系统</div>
</div>

<script>
    // 当前模式：login / register
    let mode = 'login';

    function switchTab(t) {
        mode = t;
        document.getElementById('tabLogin').className = 'tab' + (t === 'login' ? ' active' : '');
        document.getElementById('tabRegister').className = 'tab' + (t === 'register' ? ' active' : '');
        document.getElementById('btnSubmit').textContent = t === 'login' ? '登 录' : '注 册';
        document.getElementById('msg').textContent = '';
        document.getElementById('msg').className = 'msg';
    }

    // 回车提交
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    function submit() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');
        const btn = document.getElementById('btnSubmit');

        if (!username || !password) {
            msg.textContent = '请输入用户名和密码';
            msg.className = 'msg err';
            return;
        }
        if (mode === 'register' && password.length < 6) {
            msg.textContent = '密码至少6位';
            msg.className = 'msg err';
            return;
        }

        btn.disabled = true;
        const url = mode === 'login' ? '/api/login' : '/api/register';
        fetch(url + '?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password),
              { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    if (mode === 'login') {
                        msg.textContent = '✅ 登录成功，正在进入...';
                        msg.className = 'msg ok';
                        setTimeout(() => { location.href = '/index.html'; }, 600);
                    } else {
                        msg.textContent = '✅ 注册成功，请登录';
                        msg.className = 'msg ok';
                        switchTab('login');
                        document.getElementById('password').value = '';
                    }
                } else {
                    msg.textContent = '❌ ' + data.message;
                    msg.className = 'msg err';
                }
                btn.disabled = false;
            })
            .catch(() => {
                msg.textContent = '❌ 网络错误，请重试';
                msg.className = 'msg err';
                btn.disabled = false;
            });
    }
</script>
</body>
</html>
