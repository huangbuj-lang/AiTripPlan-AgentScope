server:
  port: 8081

spring:
  # ★新功能：MySQL 数据源（连接阿里云RDS）
  # 连接信息用环境变量注入（服务器启动时设置），密码不写进代码，保证安全
  datasource:
    url: jdbc:mysql://${RDS_HOST:127.0.0.1:3306}/aitripplan?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${RDS_USER:trip_user}
    password: ${RDS_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
