# 漫旅 AiTripPlan 容器编排：mysql + nacos + manager(8091) + route(8082) + trip(8085)
# 说明：三个 Java 服务共用一个镜像，靠 SVC 环境变量选 jar；.env 里只放 key，不打进镜像。

services:
  mysql:
    image: mysql:8.0
    container_name: aitrip-mysql
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root
      MYSQL_DATABASE: aitripplan          # 自动建库
      MYSQL_USER: trip_user               # 自动建业务账号并授权到 aitripplan
      MYSQL_PASSWORD: change_me_user
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # 只在数据卷为空时执行一次
    ports: ["3307:3306"]                  # 宿主机用 3307，避免和你本机 3306 的 MySQL 冲突
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchange_me_root"]
      interval: 5s
      timeout: 3s
      retries: 30

  nacos:
    image: nacos/nacos-server:v3.2.4      # 与本机 Nacos 3.2.4 对齐；拉不到就换 v3.0.2
    container_name: aitrip-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"          # 内网自用先关鉴权，简化排错
      # Nacos 3.x 启动脚本强制要求这两个值，即便关掉鉴权也必须有，否则容器 exit 255
      NACOS_AUTH_TOKEN: "QWlUcmlwUGxhbk5hY29zU2VjcmV0S2V5MjAyNjExMDk="
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: aitripplan-docker
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  manager:
    build: .
    image: aitrip-app:latest
    container_name: aitrip-manager
    environment:
      SVC: manager
      NACOS_SERVER_ADDR: nacos:8848       # 关键：容器里不能用 localhost
      RDS_HOST: mysql:3306                # 代码里 RDS_HOST 带端口，必须写成 host:port
      RDS_USER: trip_user
      RDS_PASSWORD: change_me_user
      TZ: Asia/Shanghai
    env_file: [.env]                      # DeepSeek / 高德 的 key 从这里注入
    ports: ["8091:8091"]
    depends_on:
      nacos: {condition: service_healthy}
      mysql: {condition: service_healthy}

  route:
    build: .
    image: aitrip-app:latest
    container_name: aitrip-route
    environment:
      SVC: route
      NACOS_SERVER_ADDR: nacos:8848
      # 源码里为规避本机 VPN 误探测写死了 127.0.0.1，容器里必须改成 0.0.0.0 并让 card 用容器名
      APP_ARGS: "--server.address=0.0.0.0 --agentscope.a2a.server.card.url=http://route:8082"
      TZ: Asia/Shanghai
    env_file: [.env]
    ports: ["8082:8082"]
    depends_on:
      nacos: {condition: service_healthy}

  trip:
    build: .
    image: aitrip-app:latest
    container_name: aitrip-trip
    environment:
      SVC: trip
      NACOS_SERVER_ADDR: nacos:8848
      APP_ARGS: "--server.address=0.0.0.0 --agentscope.a2a.server.card.url=http://trip:8085"
      TZ: Asia/Shanghai
    env_file: [.env]
    ports: ["8085:8085"]
    depends_on:
      nacos: {condition: service_healthy}

volumes:
  mysql_data:
